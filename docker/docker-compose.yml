version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: ss2db-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ss2db_test
      POSTGRES_USER: ss2db_user
      POSTGRES_PASSWORD: ss2db_password
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ./postgres/sample_data.sql:/docker-entrypoint-initdb.d/02-sample_data.sql:ro
    networks:
      - ss2db-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ss2db_user -d ss2db_test"]
      interval: 10s
      timeout: 5s
      retries: 5

  mysql:
    image: mysql:8.0
    container_name: ss2db-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: ss2db_test
      MYSQL_USER: ss2db_user
      MYSQL_PASSWORD: ss2db_password
      MYSQL_CHARSET: utf8mb4
      MYSQL_COLLATION: utf8mb4_unicode_ci
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ./mysql/sample_data.sql:/docker-entrypoint-initdb.d/02-sample_data.sql:ro
      - ./mysql/mysql.cnf:/etc/mysql/conf.d/custom.cnf:ro
    networks:
      - ss2db-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "ss2db_user", "-pss2db_password"]
      interval: 10s
      timeout: 5s
      retries: 5

  adminer:
    image: adminer:4.8.1
    container_name: ss2db-adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    networks:
      - ss2db-network
    depends_on:
      postgres:
        condition: service_healthy
      mysql:
        condition: service_healthy
    environment:
      ADMINER_DEFAULT_SERVER: postgres

volumes:
  postgres_data:
    driver: local
    name: ss2db_postgres_data
  mysql_data:
    driver: local
    name: ss2db_mysql_data

networks:
  ss2db-network:
    driver: bridge
    name: ss2db-network